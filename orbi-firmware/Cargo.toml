[package]
name = "orbi-firmware"
version = "0.2.0"
authors = ["William <wtekpeh@murphygs.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp-backtrace = { version = "0.19.0", features = [
    "esp32",
    "panic-handler",
    "println",
] }
esp-hal = { version = "1.1.1", features = ["esp32", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32", "log-04"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32"] }
embedded-sdmmc = "0.9.0"
embedded-hal-bus = "0.3.0"
log = "0.4.22"
heapless = "0.8.0"
esp-storage = { version = "0.9.0", features = ["esp32"] }
embedded-storage = "0.3.1"
[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

[profile.dev.package.esp-storage]
opt-level = 3